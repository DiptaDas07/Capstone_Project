<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — SleepCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #0a0f1e;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: #0a0f1e;
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 48px 44px;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(12px);
        }

        .shield-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #4f1d96, #7c3aed);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 24px;
            box-shadow: 0 8px 24px rgba(124,58,237,0.4);
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-align: center;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 32px;
        }

        .flash-msg {
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }

        .flash-success {
            background: rgba(34,197,94,0.12);
            border: 1px solid rgba(34,197,94,0.35);
            color: #86efac;
        }

        .flash-error {
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-family: 'DM Sans', sans-serif;
            outline: none;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }

        input:focus { border-color: #7c3aed; }

        input::placeholder { color: #475569; }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4f1d96, #7c3aed);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(124,58,237,0.45);
            transition: all 0.25s;
            margin-top: 4px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(124,58,237,0.6);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #60a5fa;
            text-decoration: none;
        }

        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="card">
    <div class="shield-icon">🛡️</div>
    <h2>Admin Login</h2>
    <p class="subtitle">SleepCare Admin Panel</p>

    {% with messages = get_flashed_messages(with_categories=true, category_filter=['admin_success', 'admin_error']) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash-msg {% if category == 'admin_success' %}flash-success{% else %}flash-error{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('admin_login') }}">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter admin username" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>

        <button type="submit" class="btn-submit">Login as Admin</button>
    </form>

    <a href="{{ url_for('index') }}" class="back-link">← Back to Home</a>
</div>

<script>
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    function initStars() {
        stars = [];
        for (let i = 0; i < 150; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 1.4 + 0.3,
                phase: Math.random() * Math.PI * 2,
                speed: Math.random() * 0.005 + 0.002
            });
        }
    }

    function draw(t) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(s => {
            const a = 0.2 + 0.6 * Math.sin(t * s.speed + s.phase);
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(147,197,253,${a.toFixed(2)})`;
            ctx.fill();
        });
        requestAnimationFrame(draw);
    }

    resize();
    initStars();
    requestAnimationFrame(draw);

    window.addEventListener('resize', () => {
        resize();
        initStars();
    });
</script>
</body>
</html>
